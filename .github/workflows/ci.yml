name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm comes from `packageManager` and Node from `devEngines.runtime`,
      # so this replaces `pnpm/action-setup` and `actions/setup-node` together
      # and caches the store itself. `install: false` because the action's own
      # install is not a frozen one, and a stale lockfile must fail here.
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @fridgeweek/core exec playwright install --with-deps chromium

      - name: Sheet snapshots
        run: pnpm test:visual

      - name: Browser tests for the builder
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            packages/core/test-results
            apps/web/test-results
          if-no-files-found: ignore
