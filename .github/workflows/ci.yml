name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One step for the whole toolchain: pnpm comes from `packageManager`,
      # Node from `devEngines.runtime`, and `require-lockfile` makes the
      # install it runs a frozen one. It replaces `pnpm/action-setup` and
      # `actions/setup-node` together, and caches the store itself.
      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Install Chromium
        run: pnpm --filter @fridgeweek/core exec playwright install --with-deps chromium

      - name: Sheet snapshots
        run: pnpm test:visual

      - name: Browser tests for the builder
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: |
            packages/core/test-results
            apps/web/test-results
          if-no-files-found: ignore
