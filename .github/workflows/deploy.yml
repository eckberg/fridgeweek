name: Deploy

# Deploying is a button, never a consequence of merging. Merging to main is
# reviewed and tested; publishing is a separate decision, taken by a person.
#
# Three things stand between a stranger and fridgeweek.com. `workflow_dispatch`
# can only be started by an account with write access to this repository, so a
# fork or a drive-by pull request cannot reach it. The `production` environment
# below is where a required reviewer and a branch rule are configured, and it is
# what the two Cloudflare secrets belong to rather than the repository at large.
# And the job refuses any ref but main, so the button cannot publish something
# that never went through a pull request.
#
# docs/DEPLOYING.md has the secrets it needs and how to set the guards up.
on:
  workflow_dispatch:

# One deploy at a time, and never cancel one half-way: an interrupted
# `wrangler deploy` is a worse state than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://fridgeweek.com
    steps:
      - uses: actions/checkout@v7

      # Also enforced by the environment's deployment branch rule, when that is
      # configured. Here as well, so the repository states the rule itself
      # rather than leaving it only in settings nobody reads.
      - name: Refuse to deploy anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main; this run is on ${GITHUB_REF_NAME}."
          exit 1

      # Same provisioning as ci.yml: pnpm from `packageManager`, Node from
      # `devEngines.runtime`.
      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # The same script a maintainer runs locally, so there is one recipe for
      # what a deploy is rather than a copy of it here that can drift. It builds
      # with DEPLOY_TARGET=cloudflare and deploys the merged wrangler.json the
      # adapter writes.
      - name: Build and deploy
        run: pnpm deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
