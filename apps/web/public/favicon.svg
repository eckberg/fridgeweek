<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fridgeweek">
  <title>Fridgeweek</title>
  <!--
    No plate behind the mark: it sits on whatever the browser puts there, light
    or dark. The crease dividing the two front facets is drawn in the background
    colour everywhere else in the brand, which cannot work on a transparent
    icon, so here it is punched through the artwork as a gap instead.
  -->
  <mask id="crease">
    <rect width="64" height="64" fill="#fff" />
    <line x1="32" y1="14" x2="32" y2="47" stroke="#000" stroke-width="1.2" />
  </mask>
  <g mask="url(#crease)">
    <polygon points="10,47 32,14 32,47" fill="#f5c5ab" />
    <polygon points="32,14 51,47 32,47" fill="#e08256" />
    <polygon points="32,14 58,19 37,28" fill="#a8471b" />
    <polygon points="10,47 17,56 29,47" fill="#ce6234" />
  </g>
</svg>
